<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Australianos</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <header class="topo">
    <div class="container py-4">
      <h1 class="m-0">Meu Hobby</h1>
      <p class="m-0">Criação de passaros.</p>
    </div>
  </header>

  <nav class="navbar navbar-expand-lg navbar-dark menu-principal">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">Meu Site</a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNavegacao"
        aria-controls="menuNavegacao" aria-expanded="false" aria-label="Alternar navegação">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="menuNavegacao">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link active" href="index.html">Início</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="produtos.html">Produtos</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="contato.html">Contato</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container my-5">

    <section class="mb-5">
      <h2 class="titulo-secao mb-4">Periquito Australiano</h2>

      <div id="carrosselPrincipal" class="carousel slide shadow-sm rounded-4 overflow-hidden" data-bs-ride="carousel">
        <div class="carousel-indicators">
          <button type="button" data-bs-target="#carrosselPrincipal" data-bs-slide-to="0" class="active"
            aria-current="true" aria-label="Slide 1"></button>
          <button type="button" data-bs-target="#carrosselPrincipal" data-bs-slide-to="1" aria-label="Slide 2"></button>
          <button type="button" data-bs-target="#carrosselPrincipal" data-bs-slide-to="2" aria-label="Slide 3"></button>
        </div>

        <div class="carousel-inner">
          <div class="carousel-item active">
            <img src="img/banner1.jpg" class="d-block w-100 imagem-carrossel" alt="Imagem 1">
            <div class="carousel-caption d-none d-md-block">
            </div>
          </div>

          <div class="carousel-item">
            <img src="img/banner2.jpg" class="d-block w-100 imagem-carrossel" style="object-position: center 35%;"
              alt="Imagem 2">
            <div class="carousel-caption d-none d-md-block">
            </div>
          </div>

          <div class="carousel-item">
            <img src="img/banner3.jpg" class="d-block w-100 imagem-carrossel" alt="Imagem 3">
            <div class="carousel-caption d-none d-md-block">
            </div>
          </div>
        </div>

        <button class="carousel-control-prev" type="button" data-bs-target="#carrosselPrincipal" data-bs-slide="prev">
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Anterior</span>
        </button>

        <button class="carousel-control-next" type="button" data-bs-target="#carrosselPrincipal" data-bs-slide="next">
          <span class="carousel-control-next-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Próximo</span>
        </button>
      </div>
    </section>

    <section>
      <h2 class="titulo-secao mb-4">Galeria de fotos</h2>

      <div class="row g-4">
        <div class="col-sm-6 col-lg-4">
          <figure class="card-galeria">
            <img src="img/foto1.jpg" alt="Foto 1" class="img-fluid">
            <figcaption>Alimentação</figcaption>
            <div class="card-img-overlay card-galeria p-card">
              <ul>
                <li>Alpiste</li>
                <li>Painço</li>
                <li>Couve</li>
                <li>Cenoura</li>
                <li>Maçã</li>
                <li>Milho verde</li>
                <li>Brócolis</li>
                <li>Jiló</li>
                <li>Ração extrusada</li>
                <a href="produtos.html">mais detalhes</a>
              </ul>
            </div>
          </figure>
        </div>

        <div class="col-sm-6 col-lg-4">
          <figure class="card-galeria">
            <img src="img/foto2.jpg" alt="Foto 2" class="img-fluid" style="object-position: center 9%;">
            <figcaption>Reprodução</figcaption>
            <div class="card-img-overlay card-galeria p-card">
              <ul>
                <li>Casal compatível</li>
                <li>Ninho adequado</li>
                <li>Maravalha limpa</li>
                <li>Farinhada</li>
                <li>Cálcio extra</li>
                <li>Ambiente tranquilo</li>
                <li>Controle de temperatura</li>
                <li>Controle de umidade</li>
                <li>Identificação dos filhotes</li>
                <li>Registro dos cruzamentos</li>
              </ul>
            </div>
          </figure>
        </div>

        <div class="col-sm-6 col-lg-4">
          <figure class="card-galeria">
            <img src="img/foto3.jpg" alt="Foto 3" class="img-fluid" style="object-position: center 20%;">
            <figcaption>Posiveis doenças</figcaption>
            <div class="card-img-overlay card-galeria p-card">
              <ul>
                <li>Ácaros</li>
                <li>Coccidiose</li>
                <li>Megabactéria</li>
                <li>Sarna de bico</li>
                <li>Diarreia bacteriana</li>
                <li>Infecção respiratória</li>
                <li>Deficiência de vitamina A</li>
                <li>Verminose</li>
                <li>Psitacose</li>
                <li>Intoxicação alimentar</li>
              </ul>
            </div>
          </figure>
        </div>

        <div class="col-sm-6 col-lg-4">
          <figure class="card-galeria">
            <img src="img/foto4.jpg" alt="Foto 4" class="img-fluid" style="object-position: center 10%;">
            <figcaption>Cuidados basicos</figcaption>
            <div class="card-img-overlay card-galeria p-card">
              <ul>
                <li>Trocar água diariamente</li>
                <li>Limpar a gaiola</li>
                <li>Oferecer sol da manhã</li>
                <li>Evitar vento forte</li>
                <li>Fazer quarentena em aves novas</li>
                <li>Manter alimentação variada</li>
                <li>Observar fezes</li>
                <li>Cortar excesso de unhas quando necessário</li>
                <li>Evitar superlotação</li>
                <li>Vermifugar com orientação veterinária</li>
              </ul>
            </div>
          </figure>
        </div>

        <div class="col-sm-6 col-lg-4">
          <figure class="card-galeria">
            <img src="img/foto5.jpg" alt="Foto 5" class="img-fluid" style="object-position: center 30%;">
            <figcaption>Curiosidades</figcaption>
            <div class="card-img-overlay card-galeria p-card">
              <ul>
                <li>Conseguem imitar sons</li>
                <li>Enxergam ultravioleta</li>
                <li>Vivem em bandos</li>
                <li>Gostam de companhia</li>
                <li>Dormem cedo</li>
                <li>Reconhecem pessoas</li>
                <li>Podem aprender truques</li>
                <li>Possuem excelente audição</li>
                <li>Existem centenas de combinações genéticas possíveis</li>
              </ul>
            </div>
          </figure>
        </div>

        <div class="col-sm-6 col-lg-4">
          <figure class="card-galeria">
            <img src="img/foto6.jpg" alt="Foto 6" class="img-fluid" style="object-position:center 39%;">
            <figcaption>Dica bonus</figcaption>
            <div class="card-img-overlay card-galeria p-card">
              <p>As Codorna-chinesa são muito usadas em viveiros porque vivem no chão e ajudam a comer sementes e restos de comida, deixando o ambiente mais limpo. Também auxiliam no controle de pequenos insetos e aproveitam um espaço que outras aves normalmente não usam. Além disso, deixam o viveiro mais bonito e movimentado.</p>
            </div>
          </figure>
        </div>
      </div>
    </section>

  </main>

  <footer class="rodape">
    <div class="container py-4 text-center">
      <p class="m-0">Desenvolvido para fins didáticos, com HTML, CSS e Bootstrap.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
